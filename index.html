<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Script Whitelist Injector</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --text: #c9d1d9;
      --text-bright: #ffffff;
      --success: #238636;
      --success-hover: #2ea043;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header {
      text-align: center;
      padding: 10px 0;
    }
    .header h1 {
      color: var(--text-bright);
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .header p {
      color: #8b949e;
      font-size: 14px;
      margin-top: 6px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-group label {
      font-size: 13px;
      font-weight: 500;
      color: #8b949e;
    }
    .input-group input {
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border 0.15s;
    }
    .input-group input:focus {
      border-color: var(--accent);
    }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      background: #0d1117;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(88, 101, 242, 0.05);
    }
    .drop-zone p {
      font-size: 14px;
      color: var(--text);
    }
    .drop-zone span {
      font-size: 12px;
      color: #8b949e;
      display: block;
      margin-top: 4px;
    }
    textarea {
      width: 100%;
      height: 180px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #7ee787;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      padding: 12px;
      resize: vertical;
      outline: none;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      flex: 1;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-success {
      background: var(--success);
      color: #ffffff;
    }
    .btn-success:hover {
      background: var(--success-hover);
    }
    .btn-secondary {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text-bright);
    }
    .btn-secondary:hover {
      background: #30363d;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(35, 134, 54, 0.2);
      color: #3fb950;
      border: 1px solid rgba(35, 134, 54, 0.4);
      margin-left: auto;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-top: 10px;
      color: var(--text);
      cursor: pointer;
    }
    .checkbox-row input {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ Whitelist Script Injector</h1>
      <p>Drop your Roblox script below to automatically wrap it with your Discord & GitHub Whitelist system.</p>
    </div>

    <div class="card">
      <div class="card-title">
        ⚙️ Configuration
        <span class="status-badge">Auto-Saved</span>
      </div>
      <div class="grid">
        <div class="input-group">
          <label for="githubUrl">GitHub Raw Keys URL</label>
          <input type="text" id="githubUrl" value="https://raw.githubusercontent.com/joelabonite16-web/slimes-hub-keys/main/keys.json">
        </div>
        <div class="input-group">
          <label for="discordInvite">Discord Invite Link</label>
          <input type="text" id="discordInvite" value="https://discord.gg/REc49nm87">
        </div>
        <div class="input-group">
          <label for="hubTitle">Script / Hub Title</label>
          <input type="text" id="hubTitle" value="Script Hub">
        </div>
        <div class="input-group">
          <label for="keyFile">Saved Key File Name</label>
          <input type="text" id="keyFile" value="hub_key.txt">
        </div>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="stripComments" checked>
        Strip all comments (--) from the generated script
      </label>
    </div>

    <div class="card">
      <div class="card-title">📥 Input Script</div>
      <div class="drop-zone" id="dropZone">
        <p>📁 Drag & drop your <b>.lua</b> or <b>.txt</b> file here</p>
        <span>or click to browse from your computer</span>
        <input type="file" id="fileInput" accept=".lua,.txt" style="display:none">
      </div>
      <textarea id="inputCode" placeholder="Or paste your raw Roblox script here..."></textarea>
      <div class="actions">
        <button class="btn-primary" id="generateBtn">⚡ Generate Protected Script</button>
      </div>
    </div>

    <div class="card" id="outputCard" style="display:none;">
      <div class="card-title">
        🔒 Protected Script Output
        <span class="status-badge" style="background:rgba(88,101,242,0.2);color:#5865f2;border-color:rgba(88,101,242,0.4)">Ready to Execute</span>
      </div>
      <textarea id="outputCode" readonly style="height: 250px;"></textarea>
      <div class="actions">
        <button class="btn-success" id="copyBtn">📋 Copy Script</button>
        <button class="btn-secondary" id="downloadBtn">💾 Download .lua File</button>
      </div>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const inputCode = document.getElementById('inputCode');
    const outputCode = document.getElementById('outputCode');
    const outputCard = document.getElementById('outputCard');
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) readFile(file);
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) readFile(file);
    });

    function readFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        inputCode.value = e.target.result;
      };
      reader.readAsText(file);
    }

    function removeLuaComments(str) {
      str = str.replace(/--\[\[[\s\S]*?\]\]/g, '');
      str = str.replace(/--.*$/gm, '');
      str = str.replace(/^\s*[\r\n]/gm, '');
      return str;
    }

    generateBtn.addEventListener('click', () => {
      let code = inputCode.value.trim();
      if (!code) {
        alert('Please paste or drop a script first!');
        return;
      }

      const shouldStrip = document.getElementById('stripComments').checked;
      if (shouldStrip) {
        code = removeLuaComments(code);
      }

      const githubUrl = document.getElementById('githubUrl').value.trim();
      const discordInvite = document.getElementById('discordInvite').value.trim();
      const hubTitle = document.getElementById('hubTitle').value.trim() || 'Script Hub';
      const keyFile = document.getElementById('keyFile').value.trim() || 'hub_key.txt';

      const template = `local HttpService = game:GetService("HttpService")
local Players = game:GetService("Players")
local LocalPlayer = Players.LocalPlayer

local githubKeysUrl = "${githubUrl}"
local discordInvite = "${discordInvite}"
local keyFileName = "${keyFile}"

local isVerified = false
local enteredKey = ""
local validKeys = {}

local function fetchGitHubKeys()
    local ok, res = pcall(function()
        return game:HttpGet(githubKeysUrl .. "?t=" .. tostring(os.time()))
    end)
    if ok and res then
        pcall(function()
            validKeys = HttpService:JSONDecode(res)
        end)
    end
end

fetchGitHubKeys()

local function isKeyValid(k)
    if not k or k == "" then return false end
    fetchGitHubKeys()
    if validKeys and validKeys[k] then
        return true
    end
    return false
end

if isfile and readfile and isfile(keyFileName) then
    pcall(function()
        local saved = readfile(keyFileName)
        if saved and saved ~= "" and isKeyValid(saved) then
            isVerified = true
            enteredKey = saved
        end
    end)
end

if not isVerified then
    if setclipboard then
        pcall(function() setclipboard(discordInvite) end)
    end

    local Fluent = loadstring(game:HttpGet("https://github.com/dawid-scripts/Fluent/releases/latest/download/main.lua"))()
    local Window = Fluent:CreateWindow({
        Title = "${hubTitle}",
        SubTitle = "Verification Gate",
        TabWidth = 140,
        Size = UDim2.fromOffset(500, 320),
        Acrylic = true,
        Theme = "Dark",
        MinimizeKey = Enum.KeyCode.LeftControl
    })

    local MainTab = Window:AddTab({ Title = "Verify", Icon = "key" })

    MainTab:AddParagraph({
        Title = "Discord Whitelist Required",
        Content = "You must be in our Discord server to use this script.\\n1. Join: " .. discordInvite .. "\\n2. Run /getkey in Discord\\n3. Paste your key below\\n(Invite link copied to clipboard!)"
    })

    MainTab:AddInput("KeyInput", {
        Title = "Enter Your Key",
        Default = "",
        Placeholder = "KEY-XXXX-XXXX-XXXX",
        Numeric = false,
        Finished = true,
        Callback = function(val)
            val = string.gsub(val, "%s+", "")
            if isKeyValid(val) then
                isVerified = true
                enteredKey = val
                if writefile then
                    pcall(function() writefile(keyFileName, val) end)
                end
                Fluent:Notify({
                    Title = "Verified!",
                    Content = "Key accepted. Loading script...",
                    Duration = 4
                })
                task.wait(1.2)
                pcall(function() Window:Destroy() end)
            else
                Fluent:Notify({
                    Title = "Invalid Key",
                    Content = "Key not found. Join " .. discordInvite .. " and type /getkey",
                    Duration = 6
                })
            end
        end
    })

    while not isVerified do
        task.wait(0.5)
    end
end

${code}`;

      let finalCode = template;
      if (shouldStrip) {
        finalCode = removeLuaComments(finalCode);
      }

      outputCode.value = finalCode;
      outputCard.style.display = 'block';
      outputCard.scrollIntoView({ behavior: 'smooth' });
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(outputCode.value).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✅ Copied to Clipboard!';
        setTimeout(() => {
          copyBtn.textContent = originalText;
        }, 2000);
      });
    });

    downloadBtn.addEventListener('click', () => {
      const blob = new Blob([outputCode.value], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'protected_script.lua';
      a.click();
    });
  </script>
</body>
</html>
